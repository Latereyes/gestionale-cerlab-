{% extends "base.html" %}
{% block body %}
<div class="card" style="max-width: 600px; margin: 20px auto;">
    <h2>Cambia la tua Password</h2>

    {% if session.force_password_reset %}
    <p class="flash-warning">Per motivi di sicurezza, è necessario impostare una nuova password.</p>
    {% endif %}

    <form method="post">
        <div class="form-group">
            <label for="new_password1">Nuova Password</label>
            <input type="password" name="new_password1" required>
        </div>
        <div class="form-group">
            <label for="new_password2">Conferma Nuova Password</label>
            <input type="password" name="new_password2" required>
        </div>
        <div class="toolbar" style="justify-content: flex-end;">
            <button type="submit" class="btn primary">Salva Nuova Password</button>
        </div>
    </form>
</div>
<style>
.form-group { margin-bottom: 16px; }
.flash-warning { background: #fff3e0; color: #e65100; border: 1px solid #ffcc80; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
</style>
{% endblock %}
