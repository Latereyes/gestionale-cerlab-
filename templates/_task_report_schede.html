{# Task e Report sono due schede della stessa sezione: questa barra sta in cima a tutte e due le pagine.
   Prima dell'include: {% set scheda_tr = 'task' %} oppure 'report'. #}
<nav class="tr-schede" aria-label="Task e Report">
    <a href="{{ url_for('tasks_page') }}" class="tr-scheda {{ 'attiva' if scheda_tr == 'task' }}" {% if scheda_tr == 'task' %}aria-current="page"{% endif %}>
        <span class="tr-icona"><i class="fas fa-tasks"></i></span>
        <span class="tr-testo"><strong>Task</strong><small>Cosa c'è da fare, con la data prevista</small></span>
    </a>
    <a href="{{ url_for('report_page') }}" class="tr-scheda {{ 'attiva' if scheda_tr == 'report' }}" {% if scheda_tr == 'report' %}aria-current="page"{% endif %}>
        <span class="tr-icona"><i class="fas fa-clipboard-list"></i></span>
        <span class="tr-testo"><strong>Report</strong><small>Cosa hai fatto, voce per voce</small></span>
    </a>
</nav>
<style>
    .tr-schede { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; margin-bottom: 18px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-lg); }
    .tr-scheda { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); text-decoration: none; color: var(--text-muted); transition: background 0.15s, box-shadow 0.15s, color 0.15s; min-width: 0; }
    .tr-scheda:hover { background: var(--surface); color: var(--text); }
    .tr-scheda.attiva { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
    .tr-icona { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); }
    .tr-scheda.attiva .tr-icona { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tr-testo { min-width: 0; }
    .tr-testo strong { display: block; font-size: 16px; }
    .tr-scheda.attiva .tr-testo strong { color: var(--accent); }
    .tr-testo small { display: block; font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (max-width: 600px) {
        .tr-scheda { padding: 10px; gap: 8px; }
        .tr-icona { width: 34px; height: 34px; font-size: 15px; }
        .tr-testo small { display: none; }
    }
</style>
