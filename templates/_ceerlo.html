{# Ceerlo, l'assistente AI: personaggio in basso a sinistra con fumetto e chat, in tutte le pagine (incluso da base.html).
   L'avatar si sostituisce mettendo un'immagine in static/ceerlo/ (avatar.gif, avatar.png o avatar.webp). #}
<div id="ceerlo" class="ceerlo" data-cliente="{{ current_client_id or (request.view_args or {}).get('client_id', '') }}"
     data-preventivo="{{ current_quote_id or (request.view_args or {}).get('quote_id', '') }}">
    <div class="ceerlo-fumetto" id="ceerlo-fumetto" hidden>
        <button type="button" class="ceerlo-chiudi-fumetto" title="Chiudi">&times;</button>
        <div id="ceerlo-fumetto-testo"></div>
    </div>

    <div class="ceerlo-pannello" id="ceerlo-pannello" hidden>
        <div class="ceerlo-testa">
            <strong>Ceerlo</strong>
            <span class="ceerlo-stato" id="ceerlo-stato"></span>
            <button type="button" class="ceerlo-azione" id="ceerlo-nuova" title="Nuova conversazione"><i class="fas fa-broom"></i></button>
            <button type="button" class="ceerlo-azione" id="ceerlo-chiudi" title="Chiudi"><i class="fas fa-times"></i></button>
        </div>
        <div class="ceerlo-messaggi" id="ceerlo-messaggi"></div>
        <form class="ceerlo-scrivi" id="ceerlo-form" autocomplete="off">
            <div id="ceerlo-suggerimenti" class="mention-list"></div>
            <textarea id="ceerlo-input" class="con-badge" rows="2" maxlength="2000" placeholder="Chiedi a Ceerlo... (@ collega, # cliente o preventivo)"></textarea>
            <button type="submit" class="btn primary" id="ceerlo-invia" title="Invia"><i class="fas fa-paper-plane"></i></button>
        </form>
    </div>

    <button type="button" class="ceerlo-avatar" id="ceerlo-avatar" title="Ceerlo, l'assistente">
        {% if ceerlo_avatar %}<img src="{{ url_for('static', filename='ceerlo/' + ceerlo_avatar) }}" alt="">{% endif %}
        <svg viewBox="0 0 64 64" aria-hidden="true">
            <rect x="10" y="16" width="44" height="36" rx="14" fill="#3b4cca"/>
            <rect x="16" y="24" width="32" height="18" rx="9" fill="#fff"/>
            <circle class="ceerlo-occhio" cx="25" cy="33" r="4" fill="#1f2a7a"/>
            <circle class="ceerlo-occhio" cx="39" cy="33" r="4" fill="#1f2a7a"/>
            <line x1="32" y1="16" x2="32" y2="8" stroke="#3b4cca" stroke-width="3"/>
            <circle cx="32" cy="7" r="4" fill="#f59e0b"/>
        </svg>
        <span class="ceerlo-pensa" id="ceerlo-pensa" hidden><i></i><i></i><i></i></span>
    </button>
</div>

<style>
.ceerlo { position: fixed; left: 18px; bottom: 18px; z-index: 9998; font-size: 14px; }
.ceerlo-avatar { width: 76px; height: 76px; border: 0; background: transparent; padding: 0; cursor: pointer; position: relative;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,.25)); transition: transform .2s; }
.ceerlo-avatar:hover { transform: translateY(-3px) rotate(-4deg); }
.ceerlo-avatar img { width: 76px; height: 76px; object-fit: contain; }
.ceerlo-avatar img + svg { display: none; }
.ceerlo-avatar svg { width: 76px; height: 76px; }
.ceerlo-occhio { animation: ceerlo-blink 5s infinite; transform-origin: center; transform-box: fill-box; }
@keyframes ceerlo-blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
.ceerlo-pensa { position: absolute; top: -6px; right: -10px; background: #fff; border-radius: 10px; padding: 3px 6px; display: flex; gap: 3px; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
.ceerlo-pensa i { width: 6px; height: 6px; border-radius: 50%; background: #3b4cca; animation: ceerlo-dots 1.2s infinite; }
.ceerlo-pensa i:nth-child(2) { animation-delay: .2s; } .ceerlo-pensa i:nth-child(3) { animation-delay: .4s; }
@keyframes ceerlo-dots { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

.ceerlo-fumetto { position: absolute; left: 10px; bottom: 90px; width: 260px; background: #fffbe6; border: 1px solid #e8d77a;
    border-radius: 14px; padding: 12px 28px 12px 12px; box-shadow: 0 6px 18px rgba(0,0,0,.18); cursor: pointer; line-height: 1.45; }
.ceerlo-fumetto::after { content: ""; position: absolute; left: 22px; bottom: -9px; border: 9px solid transparent; border-bottom: 0; border-top-color: #fffbe6; }
.ceerlo-chiudi-fumetto { position: absolute; top: 4px; right: 6px; border: 0; background: none; font-size: 18px; cursor: pointer; color: #887; }

.ceerlo-pannello { position: absolute; left: 0; bottom: 90px; width: 360px; box-sizing: border-box; max-height: min(560px, 70vh); background: #fff;
    border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); display: flex; flex-direction: column; overflow: hidden; }
.ceerlo-pannello[hidden], .ceerlo-fumetto[hidden], .ceerlo-pensa[hidden] { display: none; }
.ceerlo-testa { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #3b4cca; color: #fff; }
.ceerlo-stato { font-size: 11px; opacity: .85; flex: 1; }
.ceerlo-azione { border: 0; background: none; color: #fff; cursor: pointer; font-size: 14px; }
.ceerlo-messaggi { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: #f6f7fb; min-height: 160px; }
.ceerlo-msg { max-width: 85%; min-width: 0; box-sizing: border-box; padding: 8px 11px; border-radius: 12px; white-space: pre-wrap;
    overflow-wrap: anywhere; word-break: break-word; line-height: 1.45; }
.ceerlo-msg a { overflow-wrap: anywhere; }
.ceerlo-approfondisci { align-self: flex-start; margin-top: -2px; font-size: 12.5px; padding: 5px 10px; border-radius: 14px;
    border: 1px solid #c7cdf5; background: #eef0fd; color: #3b4cca; cursor: pointer; }
.ceerlo-approfondisci:disabled { opacity: .5; cursor: default; }
.ceerlo-msg.utente { align-self: flex-end; background: #3b4cca; color: #fff; border-bottom-right-radius: 4px; }
.ceerlo-msg.utente a, .ceerlo-msg.utente .shout-mention { color: #fff; }
.ceerlo-msg.da-ceerlo { align-self: flex-start; background: #fff; border: 1px solid #e3e5ef; border-bottom-left-radius: 4px; }
.ceerlo-msg.info { align-self: center; background: none; color: #777; font-size: 12px; text-align: center; }
.ceerlo-scrivi { display: flex; gap: 6px; padding: 8px; border-top: 1px solid #eee; position: relative; min-width: 0; }
.ceerlo-scrivi .btn { flex: 0 0 auto; width: auto; }
.ceerlo-scrivi .mention-list { left: 8px; right: 8px; max-width: calc(100% - 16px); box-sizing: border-box; }
.ceerlo-scrivi .cb-editor { flex: 1; min-width: 0; border-radius: 10px; }
.ceerlo-scrivi textarea { flex: 1; min-width: 0; width: auto; box-sizing: border-box; resize: none; border-radius: 10px; padding: 8px; font: inherit; }

@media (max-width: 768px) {
    .ceerlo { left: 8px; bottom: calc(var(--m-footer-h, 0px) + 8px); }  /* sopra la barra in basso delle dashboard */
    .ceerlo-avatar, .ceerlo-avatar svg, .ceerlo-avatar img { width: 64px; height: 64px; }
    /* la chat occupa la larghezza dello schermo, margini compresi, senza mai sforare ai lati */
    .ceerlo-pannello { position: fixed; left: 8px; right: 8px; bottom: calc(var(--m-footer-h, 0px) + 80px); width: auto;
        max-width: calc(100vw - 16px); max-height: calc(100dvh - var(--m-footer-h, 0px) - 100px); }
    .ceerlo-msg { max-width: 92%; }
    .ceerlo-fumetto { bottom: 76px; width: min(260px, calc(100vw - 40px)); box-sizing: border-box; }
}
@media print { .ceerlo { display: none; } }
</style>

<script>
(function () {
    const box = document.getElementById('ceerlo');
    if (!box) return;
    const $ = id => document.getElementById(id);
    const pannello = $('ceerlo-pannello'), fumetto = $('ceerlo-fumetto'), elenco = $('ceerlo-messaggi');
    const input = $('ceerlo-input'), invia = $('ceerlo-invia'), stato = $('ceerlo-stato'), pensa = $('ceerlo-pensa');
    const leggi = (k, d) => { try { return JSON.parse(sessionStorage.getItem(k)) ?? d; } catch (e) { return d; } };
    const scrivi = (k, v) => { try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
    let storia = leggi('ceerlo-storia', []);
    let inAttesa = leggi('ceerlo-job', null);

    // Testo di Ceerlo: markdown semplice (titoli, elenchi, grassetto, corsivo), #codici come link e @colleghi come badge.
    // L'HTML viene neutralizzato prima, quindi il modello non puo' inserire codice nella pagina.
    function formatta(testo) {
        let h = String(testo).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
        h = h.split('\n').map(r => r
            .replace(/^\s*#{1,4}\s+(.+)$/, '<strong>$1</strong>')
            .replace(/^(\s*)[*-]\s+/, '$1• ')).join('\n');
        h = h.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
             .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, '$1<em>$2</em>');
        h = h.replace(/(^|[\s*(\[:>])#([A-Z0-9][A-Z0-9-]{2,})(?:\[([^\]\n]+)\])?/g,
            (m, pre, id, nome) => `${pre}<a class="shout-link" href="/ceerlo/vai/${encodeURIComponent(id)}">${nome || '#' + id}</a>`);
        return h.replace(/(^|[^\w&])@(\w+)/g, '$1<span class="shout-mention">@$2</span>');
    }

    function mostraMessaggio(ruolo, testo) {
        const d = document.createElement('div');
        d.className = 'ceerlo-msg ' + ruolo;
        if (ruolo !== 'info') d.innerHTML = formatta(testo); else d.textContent = testo;
        elenco.appendChild(d);
        elenco.scrollTop = elenco.scrollHeight;
        return d;
    }
    // Ceerlo risponde prima in modo rapido; se chiude con "Vuoi che controlli piu' a fondo?" sotto compare il tasto
    const chiedeApprofondimento = t => /a fondo\?/i.test(String(t || '').slice(-200));
    let approfondito = false;
    function tastoApprofondisci() {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'ceerlo-approfondisci';
        b.innerHTML = '<i class="fas fa-search-plus"></i> Sì, controlla più a fondo';
        b.onclick = () => {
            if (invia.disabled) return;
            b.disabled = true; approfondito = true;
            input.value = 'Sì, controlla più a fondo';
            $('ceerlo-form').requestSubmit();
        };
        elenco.appendChild(b);
        elenco.scrollTop = elenco.scrollHeight;
    }
    function disegna() {
        elenco.innerHTML = '';
        if (!storia.length) mostraMessaggio('da-ceerlo', 'Ciao! Sono Ceerlo. Chiedimi di clienti, preventivi, saldi o appuntamenti: uso i dati del gestionale e della pagina in cui sei.');
        storia.forEach(m => mostraMessaggio(m.ruolo === 'utente' ? 'utente' : 'da-ceerlo', m.testo));
        const ultimo = storia[storia.length - 1];
        if (ultimo && ultimo.ruolo !== 'utente' && chiedeApprofondimento(ultimo.testo) && !inAttesa) tastoApprofondisci();
    }
    function apri() { fumetto.hidden = true; pannello.hidden = false; disegna(); input.focus(); }

    $('ceerlo-avatar').onclick = () => pannello.hidden ? apri() : (pannello.hidden = true);
    $('ceerlo-chiudi').onclick = () => { pannello.hidden = true; };
    $('ceerlo-nuova').onclick = () => { storia = []; scrivi('ceerlo-storia', storia); disegna(); };
    fumetto.querySelector('.ceerlo-chiudi-fumetto').onclick = e => { e.stopPropagation(); fumetto.hidden = true; };
    fumetto.onclick = () => { if (fumetto.dataset.riassunto) { storia.push({ruolo: 'ceerlo', testo: fumetto.dataset.riassunto}); scrivi('ceerlo-storia', storia); } apri(); };
    // @ e # come nelle altre chat: stessi suggerimenti di base.html, Invio sceglie il primo se la lista e' aperta
    const suggerimenti = $('ceerlo-suggerimenti');
    let attesaSugg;  // piccola attesa: scrivendo veloce le ricerche non si accavallano e la lista non si duplica
    input.addEventListener('input', () => {
        clearTimeout(attesaSugg);
        attesaSugg = setTimeout(() => { if (window.handleAutocomplete) window.handleAutocomplete(input, suggerimenti); }, 180);
    });
    input.addEventListener('keydown', e => {
        const listaAperta = suggerimenti.style.display === 'block';
        if (e.key === 'Escape' && listaAperta) { suggerimenti.style.display = 'none'; e.preventDefault(); return; }
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            const primo = listaAperta && suggerimenti.querySelector('.mention-item');
            if (primo) primo.click(); else $('ceerlo-form').requestSubmit();
        }
    });

    function occupato(si, testo) {
        pensa.hidden = !si; invia.disabled = si; stato.textContent = testo || '';
    }

    async function aspetta(job) {
        occupato(true, 'sto pensando...');
        const attesa = mostraMessaggio('info', '...');
        while (true) {
            let d;
            try { d = await (await fetch('/api/ceerlo/job/' + job)).json(); }
            catch (e) { await new Promise(r => setTimeout(r, 4000)); continue; }
            if (!d.ok) { attesa.textContent = d.error; break; }
            if (d.stato === 'in_coda') {
                attesa.textContent = d.posizione ? `Ci sono ${d.posizione} richieste prima della tua: attendi un momento.` : 'Tocca a te, sto iniziando...';
            } else if (d.stato === 'in_lavoro') {
                attesa.textContent = 'Sto scrivendo la risposta...';
            } else {
                attesa.remove();
                const testo = d.stato === 'fatto' ? (d.risposta || '(nessuna risposta)') : 'Non ci sono riuscito: ' + d.errore;
                storia.push({ruolo: 'ceerlo', testo});
                scrivi('ceerlo-storia', storia.slice(-20));
                mostraMessaggio('da-ceerlo', testo);
                if (d.stato === 'fatto' && chiedeApprofondimento(testo)) tastoApprofondisci();
                if (pannello.hidden) { mostraFumetto('Ho la risposta alla tua domanda: cliccami.'); }
                break;
            }
            await new Promise(r => setTimeout(r, 2000));
        }
        inAttesa = null; scrivi('ceerlo-job', null);
        occupato(false);
    }

    $('ceerlo-form').addEventListener('submit', async e => {
        e.preventDefault();
        const testo = input.value.trim();
        if (!testo || invia.disabled) return;
        input.value = '';
        const aFondo = approfondito; approfondito = false;
        elenco.querySelectorAll('.ceerlo-approfondisci').forEach(b => b.remove());
        storia.push({ruolo: 'utente', testo});
        scrivi('ceerlo-storia', storia.slice(-20));
        mostraMessaggio('utente', testo);
        try {
            const r = await fetch('/api/ceerlo/chiedi', {method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({messaggi: storia.slice(-10), pagina: location.pathname, approfondito: aFondo,
                                      cliente_id: box.dataset.cliente, preventivo: box.dataset.preventivo})});
            const d = await r.json();
            if (!d.ok) throw new Error(d.error);
            inAttesa = d.job; scrivi('ceerlo-job', inAttesa);
            aspetta(d.job);
        } catch (err) {
            storia.pop(); scrivi('ceerlo-storia', storia);
            mostraMessaggio('info', err.message);
        }
    });

    function mostraFumetto(testo, riassunto) {
        $('ceerlo-fumetto-testo').textContent = testo;
        fumetto.dataset.riassunto = riassunto || '';
        if (pannello.hidden) fumetto.hidden = false;
    }

    // Riassunti degli appuntamenti pronti: il fumetto li propone una volta per sessione
    async function controllaRiassunti() {
        try {
            const d = await (await fetch('/api/ceerlo/riassunti')).json();
            if (!d.ok) return;
            const visti = leggi('ceerlo-visti', []);
            const nuovo = d.riassunti.find(r => !visti.includes(r.evento_id));
            if (!nuovo) return;
            visti.push(nuovo.evento_id); scrivi('ceerlo-visti', visti);
            const quando = new Date(nuovo.inizio.length > 10 ? nuovo.inizio : nuovo.inizio + 'T00:00:00');
            const etichetta = quando.toLocaleDateString('it-IT', {weekday: 'long', day: 'numeric', month: 'short'}) +
                (nuovo.inizio.length > 10 ? ' alle ' + quando.toLocaleTimeString('it-IT', {hour: '2-digit', minute: '2-digit'}) : '');
            mostraFumetto(`Ho preparato il riassunto per "${nuovo.titolo}" ${etichetta}. Cliccami per leggerlo.`,
                `Riassunto per "${nuovo.titolo}" (${etichetta}):\n\n${nuovo.testo}`);
        } catch (e) {}
    }

    if (inAttesa) aspetta(inAttesa);
    setTimeout(controllaRiassunti, 1500);
    setInterval(controllaRiassunti, 10 * 60 * 1000);
})();
</script>
