{% extends "base.html" %}
{% block body %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

<div class="search-container">
  <div class="search-card">
    <div class="search-header">
      <i class="fas fa-user-plus"></i>
      <h2>Cerca o Crea Cliente</h2>
      <p>Inizia a digitare il nome, cognome o ragione sociale per visualizzare i risultati in tempo reale.</p>
    </div>
    
    <form class="search-form" onsubmit="return false;">
      <input type="hidden" id="search-action" value="{{ request.args.get('action', 'open_archive') }}">
      
      <div class="input-group">
        <input type="search" id="search-input" placeholder="Minimo 3 lettere..." autofocus autocomplete="off">
        <button type="button" class="btn primary search-btn" title="Cerca Cliente">
          <i class="fas fa-search"></i>
        </button>
      </div>

      <div id="search-results-container"></div>
    </form>
  
    <div class="divider"><span>Oppure</span></div>
    
    <div class="new-client-action">
        <a href="{{ url_for('crea_cliente', action=action) }}" class="btn">
          <i class="fas fa-plus"></i> Crea una Nuova Anagrafica
        </a>
    </div>
  </div>
</div>

<style>
  .search-container { display: flex; align-items: flex-start; justify-content: center; min-height: 70vh; padding: 24px; padding-top: 5vh;}
  .search-card { position: relative; width: 100%; max-width: 550px; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.07); padding: 40px; text-align: center; }
  .search-header { margin-bottom: 32px; }
  .search-header i { font-size: 32px; color: var(--ink, #111); margin-bottom: 16px; }
  .search-header h2 { font-size: 24px; font-weight: 700; margin: 0 0 8px 0; }
  .search-header p { font-size: 15px; color: var(--muted, #666); margin: 0 auto; max-width: 400px; line-height: 1.6; }
  .search-form { position: relative; margin-bottom: 24px; }
  .input-group { display: flex; align-items: center; border: 1px solid #ccc; border-radius: 12px; overflow: hidden; transition: box-shadow 0.2s, border-color 0.2s; }
  .input-group:focus-within { box-shadow: 0 0 0 3px rgba(17, 17, 17, 0.1); border-color: #111; }
  .input-group input[type="search"] { flex-grow: 1; border: none; outline: none; padding: 0 20px; height: 50px; font-size: 16px; }
  input[type="search"]::-webkit-search-cancel-button { -webkit-appearance:none; }
  .input-group .search-btn { height: 50px; width: 60px; border-radius: 0 10px 10px 0; border-width: 0 0 0 1px; font-size: 18px; }
  
  /* Stili per i risultati live */
  #search-results-container {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    margin-top: 8px;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    z-index: 100;
    max-height: 300px;
    overflow-y: auto;
    text-align: left;
    display: none; /* Nascosto di default */
  }
  .result-item, .no-results, .loading-results {
    padding: 12px 16px;
    border-bottom: 1px solid #f1f5f9;
  }
  .result-item a {
    display: block;
    text-decoration: none;
    color: inherit;
  }
  .result-item:last-child { border-bottom: none; }
  .result-item:hover { background-color: #f8f9fa; }
  .result-item strong { display: block; font-size: 15px; }
  .result-item small { color: #64748b; }
  .no-results, .loading-results { color: #64748b; }

  .divider { display: flex; align-items: center; text-align: center; color: #94a3b8; margin-bottom: 24px; font-size: 13px; text-transform: uppercase; font-weight: 500; }
  .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #e2e8f0; }
  .divider span { padding: 0 16px; }
  .new-client-action .btn { padding: 10px 20px; }
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const searchInput = document.getElementById('search-input');
    const resultsContainer = document.getElementById('search-results-container');
    const searchAction = document.getElementById('search-action').value;
    let debounceTimer;

    searchInput.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            performSearch(searchInput.value);
        }, 300); // Attende 300ms dopo l'ultima digitazione
    });

    function performSearch(term) {
        term = term.trim();

        if (term.length < 3) {
            resultsContainer.style.display = 'none';
            resultsContainer.innerHTML = '';
            return;
        }

        resultsContainer.style.display = 'block';
        resultsContainer.innerHTML = '<div class="loading-results">Ricerca in corso...</div>';

        fetch(`/cliente/cerca/live?term=${encodeURIComponent(term)}`)
            .then(response => response.json())
            .then(clients => {
                resultsContainer.innerHTML = '';
                if (clients.length === 0) {
                    resultsContainer.innerHTML = '<div class="no-results">Nessun cliente trovato.</div>';
                } else {
                    clients.forEach(client => {
                        const item = document.createElement('div');
                        item.className = 'result-item';
                        
                        let url = '';
                        let linkText = '';
                        if (searchAction === 'new_quote') {
                            url = `/preventivo/nuovo/${client.id_cliente}`;
                            linkText = 'Seleziona e Crea Preventivo';
                        } else if (searchAction === 'new_quote_edile') {
                            url = `/preventivo-edile/nuovo/${client.id_cliente}`;
                            linkText = 'Seleziona e Crea Edile';
                        } else {
                            url = `/cliente/dettaglio/${client.id_cliente}`;
                            linkText = 'Apri Archivio';
                        }

                        item.innerHTML = `
                            <a href="${url}">
                                <strong>${client.cliente || client.rag_sociale}</strong>
                                <small>${client.p_iva || 'N/D'}</small>
                            </a>
                        `;
                        resultsContainer.appendChild(item);
                    });
                }
            })
            .catch(error => {
                resultsContainer.innerHTML = '<div class="no-results">Errore durante la ricerca.</div>';
                console.error('Errore Fetch:', error);
            });
    }

    // Nasconde i risultati se si clicca fuori
    document.addEventListener('click', (e) => {
        if (!searchInput.contains(e.target)) {
            resultsContainer.style.display = 'none';
        }
    });
});
</script>

{% endblock %}
