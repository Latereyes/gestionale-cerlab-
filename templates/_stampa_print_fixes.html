{# Regole di stampa comuni ai template di stampa (preventivi, bolle, verbali).
   Va incluso come ultimo blocco nell'<head>, così prevale sugli stili del template. #}
<style>
    /* Font: se Google Fonts non è raggiungibile (offline) si usano font di sistema equivalenti */
    body { font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }

    /* Testi lunghi (articoli, descrizioni) vanno a capo invece di uscire dal bordo */
    table td { overflow-wrap: anywhere; word-wrap: break-word; }
    table td.nowrap, table th.nowrap { overflow-wrap: normal; word-wrap: normal; }

    /* Messaggio per preventivi/bolle senza articoli */
    .empty-items td { text-align: center; color: #64748b; font-style: italic; padding: 18px 12px; }

    @media print {
        /* Stampa sempre sfondi e colori (righe alternate, riquadri) */
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

        /* Le righe non si spezzano a metà pagina e l'intestazione si ripete su ogni pagina */
        tr { break-inside: avoid; page-break-inside: avoid; }
        thead { display: table-header-group; }

        /* Totali, note e firma restano interi */
        .totals-section, .print-footer-block { break-inside: avoid; page-break-inside: avoid; }
        h3, .section-title { break-after: avoid; page-break-after: avoid; }
    }
</style>
