{% extends "base.html" %}
{% block body %}
<div class="card" style="max-width: 600px; margin: 20px auto;">
    <h2>Modifica Utente: {{ user.username }}</h2>
    <form method="post">
        <div class="form-group">
            <label>Username</label>
            <input name="username" value="{{ user.username }}" readonly style="background: #eee;">
        </div>
        <div class="form-group">
            <label>Nome Completo*</label>
            <input name="full_name" value="{{ user.full_name }}" required>
        </div>
        <div class="form-group">
            <label>Sigla (2-3 lettere)*</label>
            <input name="sigla" value="{{ user.sigla }}" required maxlength="3">
        </div>
        <div class="form-group">
            <label>Ruolo*</label>
            {% if user.username == session.user_id or user.role == 'amministratore' %}
            <input type="hidden" name="role" value="{{ user.role }}">
            <select disabled title="Il ruolo di un amministratore non si cambia da qui">
            {% else %}
            <select name="role" required>
            {% endif %}
                <option value="venditore" {% if user.role == 'venditore' %}selected{% endif %}>Venditore</option>
                <option value="segreteria" {% if user.role == 'segreteria' %}selected{% endif %}>Segreteria</option>
                <option value="ceo" {% if user.role == 'ceo' %}selected{% endif %}>CEO</option>
                <option value="amministratore" {% if user.role == 'amministratore' %}selected{% endif %}>Amministratore</option>
            </select>
        </div>
        {% include "_campi_email_utente.html" %}
        <div class="toolbar" style="justify-content: flex-end;">
            <a href="{{ url_for('gestisci_utenti') }}" class="btn">Annulla</a>
            <button type="submit" class="btn primary">Salva Modifiche</button>
        </div>
    </form>
</div>
<style>.form-group { margin-bottom: 16px; }</style>
{% endblock %}
