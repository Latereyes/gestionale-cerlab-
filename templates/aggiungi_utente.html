{% extends "base.html" %}
{% block body %}
<div class="card" style="max-width: 600px; margin: 20px auto;">
    <h2>Aggiungi Nuovo Utente</h2>
    <form method="post">
        <div class="form-group">
            <label>Username*</label>
            <input name="username" required>
        </div>
        <div class="form-group">
            <label>Nome Completo*</label>
            <input name="full_name" required>
        </div>
        <div class="form-group">
            <label>Sigla (2-3 lettere)*</label>
            <input name="sigla" required maxlength="3">
        </div>
        <div class="form-group">
            <label>Ruolo*</label>
            <select name="role" required>
                <option value="venditore">Venditore</option>
                <option value="segreteria">Segreteria</option>
                <option value="ceo">CEO</option>
                <option value="amministratore">Amministratore</option>
            </select>
        </div>
        <p class="muted" style="font-size: 12px;">La password iniziale verrà impostata automaticamente su `username123`. L'utente dovrà cambiarla al primo accesso.</p>
        <div class="toolbar" style="justify-content: flex-end;">
            <a href="{{ url_for('gestisci_utenti') }}" class="btn">Annulla</a>
            <button type="submit" class="btn primary">Salva Utente</button>
        </div>
    </form>
</div>
<style>.form-group { margin-bottom: 16px; }</style>
{% endblock %}
